<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PILARES CDMX{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    {% block extra_head %}{% endblock %}

    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }
        .container-fluid {
            padding: 20px;
        }
        .btn-primary {
            background: #3498db;
            border: none;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-success {
            background: #27ae60;
            border: none;
        }
        .btn-success:hover {
            background: #219a52;
        }
        .btn-danger {
            background: #e74c3c;
            border: none;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-warning {
            background: #f39c12;
            border: none;
            color: white;
        }
        .btn-warning:hover {
            background: #e67e22;
            color: white;
        }
        .btn-info {
            background: #17a2b8;
            border: none;
            color: white;
        }
        .btn-info:hover {
            background: #138496;
            color: white;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid #ecf0f1;
            font-weight: 600;
        }
        .table-responsive {
            overflow-x: auto;
        }
        .badge-excelente {
            background: #27ae60;
        }
        .badge-bueno {
            background: #3498db;
        }
        .badge-regular {
            background: #f39c12;
        }
        .badge-critico {
            background: #e74c3c;
        }
        /* Menú hamburguesa */
        .mobile-menu-btn {
            display: none !important;
        }
        .desktop-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        @media (max-width: 768px) {
            .desktop-buttons {
                display: none !important;
            }
            .mobile-menu-btn {
                display: inline-block !important;
            }
            .navbar-brand {
                font-size: 0.85rem;
            }
            .user-info {
                font-size: 0.75rem;
                margin-right: 8px;
            }
            .btn-logout {
                padding: 4px 8px;
                font-size: 0.75rem;
            }
        }
        .dropdown-menu-dark .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .dropdown-item i {
            width: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar (se puede sobreescribir en cada template) -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fas fa-map-marked-alt"></i>
                <span class="d-none d-sm-inline">PILARES CDMX</span>
                <span class="d-inline d-sm-none">PILARES</span>
            </span>
            <div class="d-flex align-items-center">
                <span class="user-info text-white me-2">
                    <i class="fas fa-user-circle"></i>
                    <span class="d-none d-sm-inline">{{ user.username }}</span>
                </span>
                <a href="{% url 'logout' %}" class="btn btn-logout btn-sm">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="d-none d-sm-inline">Salir</span>
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm ms-2">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
