<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PILARES CDMX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', sans-serif; 
        }
        .login-card { 
            background: white; 
            border-radius: 20px; 
            padding: 40px; 
            width: 400px; 
            box-shadow: 0 20px 35px rgba(0,0,0,0.2); 
        }
        .login-card h2 { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #2c3e50; 
        }
        .login-card h2 i { 
            color: #27ae60; 
            margin-right: 10px; 
        }
        .btn-login { 
            background: #3498db; 
            color: white; 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            font-weight: bold; 
            transition: all 0.3s;
        }
        .btn-login:hover { 
            background: #2980b9; 
            transform: translateY(-2px);
        }
        .logo-img { text-align: center; margin-bottom: 20px; }
        .logo-img i { font-size: 60px; color: #27ae60; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-img">
            <i class="fas fa-map-marked-alt"></i>
        </div>
        <h2>PILARES CDMX</h2>
        <p class="text-center text-muted mb-4">Sistema de Mantenimiento</p>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user"></i> Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </form>
        <hr>
        <p class="text-center text-muted small mb-0">
            <i class="fas fa-shield-alt"></i> Sistema seguro
        </p>
    </div>
</body>
</html>
